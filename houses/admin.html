<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Houses · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F3F3F1;--ink:#131718;--muted:#595C4B;--line:#C8C5C1;--green:#69706C;--cream:#F2ECDD}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Heebo,system-ui,sans-serif;padding:16px 20px 40px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;max-width:1280px;margin:0 auto 14px}
h1{margin:0;font-size:24px;font-weight:800}
h2{font-size:18px;font-weight:800;margin:0 0 4px}
h3{font-size:15px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.count{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.count small{font-size:16px;font-weight:500;color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1280px;margin:0 auto 12px}
.b{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.b[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.sep{width:1px;height:24px;background:var(--ink);opacity:.25;margin:0 4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.fchip i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.fchip[aria-pressed="false"]{opacity:.35}
.time{display:flex;align-items:center;gap:10px;font-size:13px;flex:1;min-width:280px}
.time input{flex:1;accent-color:var(--ink)}
main{max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{position:relative;background:transparent;border:0;padding:0;cursor:pointer;text-align:start}
.pick{position:absolute;top:8px;inset-inline-start:8px;display:flex;align-items:center;gap:5px;background:rgba(243,243,241,.92);border-radius:999px;padding:3px 9px 3px 6px;font-size:12px;font-weight:600}
.pick input{width:16px;height:16px;accent-color:#5F1B1C;margin:0}
.card.sel canvas{outline:3px solid #5F1B1C;outline-offset:2px}
.b.danger{border-color:#5F1B1C;color:#5F1B1C}.b.danger[data-arm]{background:#5F1B1C;color:#fff}
.b:disabled{opacity:.35;cursor:default}
.card canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:6px}
.card .m{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.card .t{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.overlay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.overlay canvas{width:100%;max-width:840px;aspect-ratio:1/1;border-radius:6px;display:block}
.data{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.panel{background:#FAFAF9;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto}
.panel p.q{margin:0 0 10px;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-weight:700;color:var(--muted);font-size:12px}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.barc{display:flex;align-items:center;gap:8px;min-width:120px}
.barc span{display:block;height:10px;border-radius:5px;background:var(--green)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.big{position:fixed;inset:0;background:rgba(19,23,24,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.big[hidden]{display:none}
.big .box{background:#FAFAF9;border-radius:14px;padding:14px;width:min(660px,100%)}
.big canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:6px}
.big .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.gate{max-width:420px;margin:60px auto;background:#FAFAF9;border:1px solid var(--line);border-radius:14px;padding:20px}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:#fff}
.msg{color:#5F1B1C;font-size:14px;min-height:1.4em}
.note{font-size:13px;color:var(--muted)}
@media (max-width:800px){.overlay{grid-template-columns:1fr}.data{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <h1 style="font-size:20px">Admin key</h1>
  <p class="note">The key you set in the Google Apps Script.</p>
  <input type="password" id="key" autocomplete="off">
  <button class="b" id="go" type="button">Open</button>
  <div class="msg" id="gmsg" role="status"></div>
</div>

<div id="app" hidden>
<header>
  <div><h1>What lives here? · Admin</h1><p class="sub" id="sub"></p></div>
  <div class="count" id="count">0<small>/100</small></div>
</header>
<div class="bar">
  <button class="b vw" data-v="grid" aria-pressed="true" type="button">All houses</button>
  <button class="b vw" data-v="overlay" aria-pressed="false" type="button">All houses layered</button>
  <button class="b vw" data-v="data" aria-pressed="false" type="button">Data</button>
  <span class="sep"></span>
  <span id="fchips"></span>
  <span class="sep"></span>
  <button class="b" id="refresh" type="button">Refresh</button>
  <button class="b" id="export" type="button">Download Excel</button>
  <button class="b" id="ar" type="button">Labels: EN</button>
  <button class="b" id="motion" type="button" aria-pressed="true">Motion on</button>
  <span class="sep"></span>
  <button class="b danger" id="delsel" type="button" disabled>Delete selected</button><span class="note" id="delmsg" role="status"></span>
</div>
<div class="bar">
  <div class="time"><button class="b" id="play" type="button">Play the 3 days</button><input type="range" id="t" min="0" max="1000" value="1000" step="1" aria-label="Time"><span id="tl"></span></div>
</div>
<main>
  <section id="vgrid"><div class="grid" id="grid"></div></section>
  <section id="voverlay" hidden>
    <div class="overlay">
      <canvas id="ov" width="1200" height="1200"></canvas>
      <div class="panel"><h3>Where each feeling was drawn</h3><p class="q" id="ovq"></p><table id="tbl"></table></div>
    </div>
  </section>
  <section id="vdata" hidden><p class="note" id="dn" style="margin:0 0 12px"></p><div class="data" id="data"></div></section>
  <p class="note" id="empty"></p>
</main>
</div>

<div class="big" id="big" hidden><div class="box"><div class="row"><strong id="bt"></strong><button class="b" id="bclose" type="button">Close</button></div><canvas id="bc" width="1100" height="1100"></canvas></div></div>

<script src="common.js"></script>
<script>
(function(){
var H=HOUSES,EN=H.T.en,TH=H.LIGHT,picked={},rows=[],only={},view='grid',labels='en',tMax=1,tMin=0,cut=Infinity,playing=null,key='',still=false,lives=[],bigLive=null,ovLive=null;
H.FEELINGS.forEach(function(f){only[f.k]=true});
function $(id){return document.getElementById(id)}
function pad(n){return String(n).padStart(2,'0')}
function fmt(ms){var d=new Date(ms);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function pct(a,b){return b?Math.round(a/b*100):0}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}

function load(){
  H.all(key).then(function(r){
    if(!r||r.error){$('app').hidden=true;$('gate').hidden=false;$('gmsg').textContent=r&&r.error==='key'?'Wrong key.':'Could not load.';return}
    try{localStorage.setItem('houses.key',key)}catch(e){}
    $('gate').hidden=true;$('app').hidden=false;
    rows=(r.rows||[]).map(function(x){var h;try{h=typeof x.data==='string'?JSON.parse(x.data):x}catch(e){return null}h.ms=new Date(x.ts||h.ts).getTime();return h}).filter(function(h){return h&&h.marks}).sort(function(a,b){return a.ms-b.ms});
    $('count').textContent=String(rows.length);var sm=el('small','/'+(r.max||100));$('count').appendChild(sm);
    $('sub').textContent=r.local?'Local test mode: houses saved in this browser only.':(rows.length?'From '+fmt(rows[0].ms)+' to '+fmt(rows[rows.length-1].ms):'No houses yet.');
    tMin=rows.length?rows[0].ms:0;tMax=rows.length?rows[rows.length-1].ms:1;cut=Infinity;$('t').value=1000;draw();
  }).catch(function(){$('gmsg').textContent='Could not load.';$('app').hidden=true;$('gate').hidden=false});
}
function visible(){return rows.filter(function(h){return h.ms<=cut})}
function chips(){var box=$('fchips');box.textContent='';
  H.FEELINGS.forEach(function(f){var b=el('button',null,'fchip');b.type='button';b.setAttribute('aria-pressed',only[f.k]);
    var i=el('i');i.style.background=TH.colors[f.k];b.appendChild(i);b.append(EN.feelings[f.k]);
    b.onclick=function(){only[f.k]=!only[f.k];chips();draw()};box.appendChild(b)})}

function draw(){
  var v=visible();$('tl').textContent=cut===Infinity?'All · '+v.length+' houses':fmt(cut)+' · '+v.length+' houses';
  $('empty').textContent=v.length?'':'No houses to show yet.';
  lives.forEach(function(l){l.stop()});lives=[];
  if(view==='grid')drawGrid(v);else if(view==='overlay')drawOverlay(v);else drawData(v);
}
function drawGrid(v){var g=$('grid');g.textContent='';
  v.slice().reverse().forEach(function(h){var c=el('button',null,'card');c.type='button';
    var cv=el('canvas');cv.width=320;cv.height=320;c.appendChild(cv);
    var m=el('div',null,'m');m.appendChild(el('span',h.town||'—','t'));m.appendChild(el('span',fmt(h.ms)));c.appendChild(m);
    var dots=el('div',null,'dots');(h.marks||[]).forEach(function(mk){var i2=el('i');i2.style.background=TH.colors[mk.k];i2.title=EN.feelings[mk.k];dots.appendChild(i2)});c.appendChild(dots);
    var pk=el('label',null,'pick'),cb=el('input');cb.type='checkbox';cb.checked=!!picked[h.id];cb.setAttribute('aria-label','Select house from '+(h.town||'')+' '+fmt(h.ms));pk.appendChild(cb);pk.append('Select');c.appendChild(pk);
    if(picked[h.id])c.classList.add('sel');
    pk.onclick=function(e){e.stopPropagation()};cb.onchange=function(){if(cb.checked)picked[h.id]=1;else delete picked[h.id];c.classList.toggle('sel',cb.checked);selUI()};
    c.onclick=function(){$('bt').textContent=(h.town||'—')+' · '+fmt(h.ms);if(bigLive)bigLive.stop();bigLive=new H.Live($('bc'),h,labels,{only:only,still:still,theme:TH});$('big').hidden=false};
    g.appendChild(c);lives.push(new H.Live(cv,h,labels,{only:only,still:still,labels:false,theme:TH,every:2}))})}
function selUI(){var n=Object.keys(picked).length,b=$('delsel');b.disabled=!n;delete b.dataset.arm;b.textContent=n?'Delete selected ('+n+')':'Delete selected'}
$('delsel').onclick=function(){var b=this,ids=Object.keys(picked);if(!ids.length)return;
  if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Sure? Delete '+ids.length+' for good';setTimeout(function(){if(b.dataset.arm)selUI()},4000);return}
  b.disabled=true;b.textContent='Deleting…';
  H.remove(key,ids).then(function(r){if(r&&r.ok){$('delmsg').textContent='Deleted '+(r.deleted!=null?r.deleted:ids.length)+'.';picked={};selUI();load()}
    else{$('delmsg').textContent=r&&r.error==='key'?'Wrong key.':'Could not delete. Update the Apps Script code (see Code.gs) and deploy a new version.';selUI()}})
  .catch(function(){$('delmsg').textContent='Could not delete. Update the Apps Script code (see Code.gs) and deploy a new version.';selUI()})};
function zoneName(z){return EN.places[z]||z}
function drawOverlay(v){
  var marks=[];v.forEach(function(h,hi){(h.marks||[]).forEach(function(m,mi){if(only[m.k])marks.push(Object.assign({_seed:hi*977+mi*131},m))})});
  var maps=v.length?v:[{v:2,streets:[],rooms:[],marks:[]}];
  var a=Math.max(.06,Math.min(1,1.5/Math.max(v.length,1)));
  if(ovLive)ovLive.stop();
  ovLive=new H.Live($('ov'),{id:'overlay',marks:[]},labels,{maps:maps,marks:marks,alpha:a,labels:v.length<=1,layerAlpha:Math.max(.35,Math.min(1,5/Math.max(v.length,1))),still:still,theme:TH});
  lives.push(ovLive);
  $('ovq').textContent='Share of the times each feeling was picked, by where most of its drawing sits. '+v.length+' houses.';
  var t=$('tbl');t.textContent='';var zones=['home','street','hood','outside'],tot={},cnt={};
  v.forEach(function(h){(h.marks||[]).forEach(function(m){var p=H.placeOf(h,m.k).zone||'outside';cnt[m.k]=(cnt[m.k]||0)+1;tot[m.k]=tot[m.k]||{};tot[m.k][p]=(tot[m.k][p]||0)+1})});
  var used=zones.filter(function(z){return H.FEELINGS.some(function(f){return tot[f.k]&&tot[f.k][z]})});
  var hr=el('tr');hr.appendChild(el('th','Feeling'));used.forEach(function(z){hr.appendChild(el('th',zoneName(z)))});t.appendChild(hr);
  H.FEELINGS.forEach(function(f){if(!only[f.k]||!cnt[f.k])return;var tr=el('tr'),td=el('td');var s=el('span',null,'sw');s.style.background=TH.colors[f.k];td.appendChild(s);td.append(EN.feelings[f.k]);tr.appendChild(td);
    used.forEach(function(z){tr.appendChild(el('td',pct((tot[f.k][z]||0),cnt[f.k])+'%','n'))});t.appendChild(tr)});
}

/* ---------- Data: all numbers are out of the houses received ---------- */
function analyse(v){
  var n=v.length,A={n:n,feel:{},pairs:{},towns:{},hours:{},define:{rooms:0,streets:0,nothing:0,roomsTotal:0}};
  H.FEELINGS.forEach(function(f){A.feel[f.k]={c:0,zone:{},room:{}}});
  v.forEach(function(h){
    var ks=(h.marks||[]).map(function(m){return m.k});
    ks.forEach(function(k){var F=A.feel[k];if(!F)return;F.c++;var p=H.placeOf(h,k);F.zone[p.zone||'outside']=(F.zone[p.zone||'outside']||0)+1;if(p.room)F.room[p.room]=(F.room[p.room]||0)+1});
    ks.slice().sort().forEach(function(a,i,arr){for(var j=i+1;j<arr.length;j++){var key=a+'|'+arr[j];A.pairs[key]=(A.pairs[key]||0)+1}});
    var town=(h.town||'—').trim();var tk=town.toLowerCase();A.towns[tk]=A.towns[tk]||{name:town,n:0,f:{}};A.towns[tk].n++;ks.forEach(function(k){A.towns[tk].f[k]=(A.towns[tk].f[k]||0)+1});
    var hr=new Date(h.ms).getHours(),b=hr>=5&&hr<12?'Morning (5–12)':hr>=12&&hr<17?'Afternoon (12–17)':hr>=17&&hr<21?'Evening (17–21)':'Night (21–5)';
    A.hours[b]=A.hours[b]||{n:0,f:{}};A.hours[b].n++;ks.forEach(function(k){A.hours[b].f[k]=(A.hours[b].f[k]||0)+1});
    var rooms=(h.rooms||[]).filter(function(r){return r.t.indexOf('hood')!==0}).length,sts=(h.streets||[]).length;
    if(rooms)A.define.rooms++;if(sts)A.define.streets++;if(!rooms&&!sts)A.define.nothing++;A.define.roomsTotal+=rooms;
  });
  return A;
}
function topK(o){var b='',c=-1;for(var k in o)if(o[k]>c){c=o[k];b=k}return [b,c]}
function bar(p){var d=el('div',null,'barc'),s=el('span');s.style.width=Math.max(2,p*.9)+'px';d.appendChild(s);d.appendChild(el('span',p+'%','n'));d.lastChild.style.background='none';d.lastChild.style.height='auto';return d}
function panel(title,q){var p=el('div',null,'panel');p.appendChild(el('h3',title));p.appendChild(el('p',q,'q'));$('data').appendChild(p);return p}
function table(p,head,rowsArr){var t=el('table'),tr=el('tr');head.forEach(function(h){tr.appendChild(el('th',h))});t.appendChild(tr);
  rowsArr.forEach(function(r){var tr2=el('tr');r.forEach(function(c){var td=el('td');if(c instanceof Node)td.appendChild(c);else{td.textContent=c;if(typeof c==='number'||/%$/.test(String(c)))td.className='n'}tr2.appendChild(td)});t.appendChild(tr2)});p.appendChild(t)}
function feelCell(k){var s=el('span');s.style.whiteSpace='nowrap';var d=el('span',null,'sw');d.style.background=TH.colors[k];s.appendChild(d);s.append(EN.feelings[k]);return s}
function drawData(v){
  var A=analyse(v),n=A.n;$('data').textContent='';
  $('dn').textContent=n?'Every percentage here is out of the '+n+' houses received so far'+(cut===Infinity?'':' (up to '+fmt(cut)+')')+', not out of 100.':'No houses yet.';
  if(!n)return;
  /* 1 */
  var p=panel('1 · Where does each feeling live?','How many houses picked each feeling, and where most of its drawing sits.');
  table(p,['Feeling','Houses','Most often in','Top room'],H.FEELINGS.filter(function(f){return A.feel[f.k].c}).sort(function(a,b){return A.feel[b.k].c-A.feel[a.k].c}).map(function(f){var F=A.feel[f.k],z=topK(F.zone),r=topK(F.room);
    return [feelCell(f.k),bar(pct(F.c,n)),zoneName(z[0])+' · '+pct(z[1],F.c)+'%',r[0]?(EN.rooms[r[0]]||r[0])+' · '+r[1]:'—']}));
  /* 2 */
  p=panel('2 · Inside the home or outside?','For each feeling: the share drawn inside the home square, out of the times it was picked.');
  table(p,['Feeling','Inside','Street','Neighbourhood'],H.FEELINGS.filter(function(f){return A.feel[f.k].c}).map(function(f){var F=A.feel[f.k];
    return [feelCell(f.k),bar(pct(F.zone.home||0,F.c)),pct(F.zone.street||0,F.c)+'%',pct((F.zone.hood||0)+(F.zone.outside||0),F.c)+'%']}));
  /* 3 */
  p=panel('3 · Which feelings come together?','Pairs picked in the same house, as a share of all houses.');
  var pairs=Object.keys(A.pairs).sort(function(a,b){return A.pairs[b]-A.pairs[a]}).slice(0,10);
  table(p,['Pair','Houses'],pairs.map(function(k){var ab=k.split('|'),s=el('span');s.appendChild(feelCell(ab[0]));s.append(' + ');s.appendChild(feelCell(ab[1]));return [s,bar(pct(A.pairs[k],n))]}));
  /* 4 */
  p=panel('4 · Does it change by town?','Towns written by participants (grouped by spelling). Small numbers are not a pattern yet.');
  var towns=Object.keys(A.towns).map(function(k){return A.towns[k]}).sort(function(a,b){return b.n-a.n});
  table(p,['Town','Houses','Most picked','Something hidden'],towns.map(function(T){var tk=topK(T.f);return [T.name,T.n+' ('+pct(T.n,n)+'%)',EN.feelings[tk[0]]||'—',pct(T.f.hidden||0,T.n)+'%']}));
  /* 5 */
  p=panel('5 · Does it change by the hour?','When the house was sent, and which feelings were picked at that time of day.');
  var order=['Morning (5–12)','Afternoon (12–17)','Evening (17–21)','Night (21–5)'];
  table(p,['Time of day','Houses','Most picked','Something hidden'],order.filter(function(b){return A.hours[b]}).map(function(b){var X=A.hours[b],tk=topK(X.f);return [b,X.n+' ('+pct(X.n,n)+'%)',EN.feelings[tk[0]]||'—',pct(X.f.hidden||0,X.n)+'%']}));
  /* 6 */
  p=panel('6 · Who defines their home?','How much people added to the plain square.');
  table(p,['','Houses'],[['Added rooms inside',bar(pct(A.define.rooms,n))],['Added streets around',bar(pct(A.define.streets,n))],['Left the square as it is',bar(pct(A.define.nothing,n))],['Average rooms per house',(Math.round(A.define.roomsTotal/n*10)/10).toString()]]);
}

document.querySelectorAll('.vw').forEach(function(b){b.onclick=function(){view=b.dataset.v;document.querySelectorAll('.vw').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
  $('vgrid').hidden=view!=='grid';$('voverlay').hidden=view!=='overlay';$('vdata').hidden=view!=='data';draw()}});
$('t').oninput=function(){var v=+this.value;cut=v>=1000?Infinity:tMin+(tMax-tMin)*v/1000;draw()};
$('play').onclick=function(){
  if(playing){clearInterval(playing);playing=null;$('play').textContent='Play the 3 days';return}
  var v=0;$('play').textContent='Pause';playing=setInterval(function(){v+=10;if(v>1000){clearInterval(playing);playing=null;$('play').textContent='Play the 3 days';v=1000}$('t').value=v;$('t').oninput()},250)};
$('refresh').onclick=load;
$('bclose').onclick=function(){$('big').hidden=true;if(bigLive){bigLive.stop();bigLive=null}};$('big').onclick=function(e){if(e.target===$('big'))$('bclose').onclick()};
$('ar').onclick=function(){labels=labels==='en'?'ar':'en';this.textContent='Labels: '+labels.toUpperCase();draw()};
$('motion').onclick=function(){still=!still;this.textContent=still?'Motion off':'Motion on';this.setAttribute('aria-pressed',!still);draw()};
$('export').onclick=function(){
  var d2=function(ms){var d=new Date(ms);return [d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pad(d.getHours())+':'+pad(d.getMinutes())]};
  var h1=[['House ID','Date','Time','Town','Language','Feeling 1','Feeling 2','Feeling 3','Where 1','Where 2','Where 3','Room 1','Room 2','Room 3','Streets added','Rooms added','Strokes']];
  var h2=[['House ID','Date','Time','Town','Feeling','Where','Room','Inside home?','Strokes','Points','Centre X (0-1000)','Centre Y (0-1000)','Distance from home centre']];
  rows.forEach(function(h){var dt=d2(h.ms),ks=(h.marks||[]).map(function(m){return m.k}),pl=ks.map(function(k){return H.placeOf(h,k)});
    h1.push([h.id,dt[0],dt[1],h.town||'',h.lang||''].concat([0,1,2].map(function(i){return ks[i]?EN.feelings[ks[i]]:''}),[0,1,2].map(function(i){return pl[i]?zoneName(pl[i].zone):''}),[0,1,2].map(function(i){return pl[i]&&pl[i].room?(EN.rooms[pl[i].room]||pl[i].room):''}),
      [(h.streets||[]).length,(h.rooms||[]).filter(function(r){return r.t.indexOf('hood')!==0}).length,(h.marks||[]).reduce(function(s,m){return s+m.s.length},0)]));
    (h.marks||[]).forEach(function(m,i){var nn=0,sx=0,sy=0;m.s.forEach(function(st){st.forEach(function(q){nn++;sx+=q[0];sy+=q[1]})});var cx=nn?Math.round(sx/nn):'',cy=nn?Math.round(sy/nn):'';
      h2.push([h.id,dt[0],dt[1],h.town||'',EN.feelings[m.k],zoneName(pl[i].zone),pl[i].room?(EN.rooms[pl[i].room]||pl[i].room):'',pl[i].zone==='home'?'yes':'no',m.s.length,nn,cx,cy,nn?Math.round(Math.hypot(cx-500,cy-500)):''])})});
  var A=analyse(rows),n=A.n,h3=[['Summary of '+n+' houses received (percentages are out of '+n+')'],[],['Feeling','Houses','% of houses','Inside home %','Street %','Neighbourhood %']];
  H.FEELINGS.forEach(function(f){var F=A.feel[f.k];h3.push([EN.feelings[f.k],F.c,pct(F.c,n),pct(F.zone.home||0,F.c),pct(F.zone.street||0,F.c),pct((F.zone.hood||0)+(F.zone.outside||0),F.c)])});
  h3.push([]);h3.push(['Pair','Houses','% of houses']);Object.keys(A.pairs).sort(function(a,b){return A.pairs[b]-A.pairs[a]}).forEach(function(k){var ab=k.split('|');h3.push([EN.feelings[ab[0]]+' + '+EN.feelings[ab[1]],A.pairs[k],pct(A.pairs[k],n)])});
  h3.push([]);h3.push(['Town','Houses','% of houses']);Object.keys(A.towns).forEach(function(k){var T=A.towns[k];h3.push([T.name,T.n,pct(T.n,n)])});
  h3.push([]);h3.push(['Time of day','Houses','% of houses']);Object.keys(A.hours).forEach(function(b){h3.push([b,A.hours[b].n,pct(A.hours[b].n,n)])});
  h3.push([]);h3.push(['Added rooms inside',A.define.rooms,pct(A.define.rooms,n)]);h3.push(['Added streets around',A.define.streets,pct(A.define.streets,n)]);h3.push(['Left the square as it is',A.define.nothing,pct(A.define.nothing,n)]);
  var bytes=H.xlsx([{name:'Houses',rows:h1},{name:'Feelings',rows:h2},{name:'Summary',rows:h3}]);
  var b=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='houses-feelings.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)};
$('go').onclick=function(){key=$('key').value.trim();$('gmsg').textContent='';load()};

chips();
if(H.local()){load()}else{try{key=localStorage.getItem('houses.key')||''}catch(e){}if(key)load();else $('gate').hidden=false}
})();
</script>
