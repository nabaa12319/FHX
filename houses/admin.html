<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Houses · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F4F1EA;--ink:#1C2340;--muted:#5F6577;--line:#D6D1C4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Heebo,system-ui,sans-serif;padding:16px 20px 40px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;max-width:1280px;margin:0 auto 14px}
h1{margin:0;font-size:24px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.count{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.count small{font-size:16px;font-weight:500;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1280px;margin:0 auto 14px}
.b{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.b[aria-pressed="true"]{background:var(--ink);color:#fff}
.sep{width:1px;height:24px;background:var(--ink);opacity:.25;margin:0 4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.fchip i{width:12px;height:12px;border-radius:50%}
.fchip[aria-pressed="false"]{opacity:.4}
.time{display:flex;align-items:center;gap:10px;font-size:13px;flex:1;min-width:260px}
.time input{flex:1;accent-color:var(--ink)}
main{max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:start}
.card canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:6px}
.card .m{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.card .t{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:4px}.dots i{width:10px;height:10px;border-radius:50%}
.overlay{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.overlay canvas{width:100%;max-width:820px;aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:12px;display:block}
.side{overflow-x:auto}.side h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:start}
th{font-weight:700;color:var(--muted)}
.big{position:fixed;inset:0;background:rgba(20,24,40,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.big[hidden]{display:none}
.big .box{background:#fff;border-radius:14px;padding:14px;width:min(640px,100%)}
.big canvas{width:100%;aspect-ratio:1/1;display:block}
.big .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.gate{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.msg{color:#A12A1F;font-size:14px;min-height:1.4em}
.note{font-size:13px;color:var(--muted)}
@media (max-width:800px){.overlay{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <h1 style="font-size:20px">Admin key</h1>
  <p class="note">The key you set in the Google Apps Script.</p>
  <input type="password" id="key" autocomplete="off">
  <button class="b" id="go" type="button">Open</button>
  <div class="msg" id="gmsg" role="status"></div>
</div>

<div id="app" hidden>
<header>
  <div><h1>Where do we feel something hidden? · Admin</h1><p class="sub" id="sub"></p></div>
  <div class="count" id="count">0<small>/100</small></div>
</header>
<div class="bar">
  <button class="b vw" data-v="grid" aria-pressed="true" type="button">All houses</button>
  <button class="b vw" data-v="overlay" aria-pressed="false" type="button">All houses layered</button>
  <span class="sep"></span>
  <span id="fchips"></span>
  <span class="sep"></span>
  <button class="b" id="refresh" type="button">Refresh</button>
  <button class="b" id="export" type="button">Download Excel</button>
  <button class="b" id="ar" type="button">Labels: EN</button>
</div>
<div class="bar">
  <div class="time"><button class="b" id="play" type="button">Play the 3 days</button><input type="range" id="t" min="0" max="1000" value="1000" step="1" aria-label="Time"><span id="tl"></span></div>
</div>
<main>
  <section id="vgrid"><div class="grid" id="grid"></div></section>
  <section id="voverlay" hidden>
    <div class="overlay">
      <canvas id="ov" width="1600" height="1600"></canvas>
      <div class="side">
        <h3>Where each feeling was drawn</h3>
        <table id="tbl"></table>
        <p class="note" style="margin-top:10px">Counted by the element (room, door, neighbourhood) that holds most of each drawing. Houses with no sketched rooms count as "Outside / unmarked".</p>
      </div>
    </div>
  </section>
  <p class="note" id="empty"></p>
</main>
</div>

<div class="big" id="big" hidden><div class="box"><div class="row"><strong id="bt"></strong><button class="b" id="bclose" type="button">Close</button></div><canvas id="bc" width="1200" height="1200"></canvas></div></div>

<script src="common.js"></script>
<script>
(function(){
var H=HOUSES,rows=[],only={},view='grid',labels='en',tMax=1,tMin=0,cut=Infinity,playing=null,key='';
H.FEELINGS.forEach(function(f){only[f.k]=true});
function $(id){return document.getElementById(id)}
function fmt(ms){var d=new Date(ms);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function load(){
  H.all(key).then(function(r){
    if(!r||r.error){$('app').hidden=true;$('gate').hidden=false;$('gmsg').textContent=r&&r.error==='key'?'Wrong key.':'Could not load.';return}
    try{localStorage.setItem('houses.key',key)}catch(e){}
    $('gate').hidden=true;$('app').hidden=false;
    rows=(r.rows||[]).map(function(x){var h=typeof x.data==='string'?JSON.parse(x.data):x;h.ms=new Date(x.ts||h.ts).getTime();return h}).filter(function(h){return h&&h.marks}).sort(function(a,b){return a.ms-b.ms});
    $('count').innerHTML='';$('count').append(String(rows.length));var sm=document.createElement('small');sm.textContent='/'+(r.max||100);$('count').append(sm);
    $('sub').textContent=r.local?'Local test mode: showing houses saved in this browser only.':(rows.length?'From '+fmt(rows[0].ms)+' to '+fmt(rows[rows.length-1].ms):'No houses yet.');
    tMin=rows.length?rows[0].ms:0;tMax=rows.length?rows[rows.length-1].ms:1;cut=Infinity;$('t').value=1000;draw();
  }).catch(function(){$('gmsg').textContent='Could not load.';$('app').hidden=true;$('gate').hidden=false});
}
function visible(){return rows.filter(function(h){return h.ms<=cut})}

function chips(){var box=$('fchips');box.textContent='';
  H.FEELINGS.forEach(function(f){var b=document.createElement('button');b.type='button';b.className='fchip';b.setAttribute('aria-pressed',only[f.k]);
    var i=document.createElement('i');i.style.background=f.color;b.appendChild(i);b.append(H.T.en.feelings[f.k]);
    b.onclick=function(){only[f.k]=!only[f.k];chips();draw()};box.appendChild(b)})}

function draw(){
  var v=visible();$('tl').textContent=cut===Infinity?'All':fmt(cut)+' · '+v.length+' houses';
  $('empty').textContent=v.length?'':'No houses to show yet.';
  if(view==='grid')drawGrid(v);else drawOverlay(v);
}
function drawGrid(v){var g=$('grid');g.textContent='';
  v.slice().reverse().forEach(function(h,i){var c=document.createElement('button');c.type='button';c.className='card';
    var cv=document.createElement('canvas');cv.width=360;cv.height=360;c.appendChild(cv);H.render(cv,h,labels,{only:only});
    var m=document.createElement('div');m.className='m';var t=document.createElement('span');t.className='t';t.textContent=h.town||'—';m.appendChild(t);
    var d=document.createElement('span');d.textContent=fmt(h.ms);m.appendChild(d);c.appendChild(m);
    var dots=document.createElement('div');dots.className='dots';(h.marks||[]).forEach(function(mk){var i2=document.createElement('i');i2.style.background=H.FC[mk.k];i2.title=H.T.en.feelings[mk.k];dots.appendChild(i2)});c.appendChild(dots);
    c.onclick=function(){$('bt').textContent=(h.town||'—')+' · '+fmt(h.ms);H.render($('bc'),h,labels,{only:only});$('big').hidden=false};g.appendChild(c)})}
function drawOverlay(v){
  var cv=$('ov'),ctx=cv.getContext('2d'),px=cv.width/H.SIZE;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(px,0,0,px,0,0);
  var a=v.length?Math.max(.12,Math.min(1,3/v.length)):1;
  v.forEach(function(h){H.drawRooms(ctx,h.rooms,labels,{alpha:Math.min(.5,a),labels:false})});
  v.forEach(function(h){H.drawMarks(ctx,h.marks,only,Math.max(.35,Math.min(1,6/Math.max(v.length,1))))});
  /* table: feeling x place */
  var places={},tot={};
  v.forEach(function(h){(h.marks||[]).forEach(function(m){var p=H.placeOf(h,m.k)||'outside';places[p]=1;tot[m.k]=tot[m.k]||{};tot[m.k][p]=(tot[m.k][p]||0)+1})});
  var pl=Object.keys(places),t=$('tbl');t.textContent='';
  var hr=document.createElement('tr');hr.appendChild(document.createElement('th'));
  H.FEELINGS.forEach(function(f){if(!only[f.k])return;var th=document.createElement('th');th.textContent=H.T.en.feelings[f.k];th.style.color=f.color;hr.appendChild(th)});t.appendChild(hr);
  pl.forEach(function(p){var tr=document.createElement('tr'),td=document.createElement('td');td.textContent=p==='outside'?H.T.en.outside:p==='hood'?'Neighbourhood':(H.T.en.rooms[p]||p);tr.appendChild(td);
    H.FEELINGS.forEach(function(f){if(!only[f.k])return;var c=document.createElement('td');c.textContent=(tot[f.k]&&tot[f.k][p])||'';tr.appendChild(c)});t.appendChild(tr)});
}

document.querySelectorAll('.vw').forEach(function(b){b.onclick=function(){view=b.dataset.v;document.querySelectorAll('.vw').forEach(function(x){x.setAttribute('aria-pressed',x===b)});$('vgrid').hidden=view!=='grid';$('voverlay').hidden=view!=='overlay';draw()}});
$('t').oninput=function(){var v=+this.value;cut=v>=1000?Infinity:tMin+(tMax-tMin)*v/1000;draw()};
$('play').onclick=function(){
  if(playing){clearInterval(playing);playing=null;$('play').textContent='Play the 3 days';return}
  var v=0;$('play').textContent='Pause';playing=setInterval(function(){v+=8;if(v>1000){clearInterval(playing);playing=null;$('play').textContent='Play the 3 days';v=1000}$('t').value=v;$('t').oninput()},80)};
$('refresh').onclick=load;
$('bclose').onclick=function(){$('big').hidden=true};$('big').onclick=function(e){if(e.target===$('big'))$('big').hidden=true};
$('ar').onclick=function(){labels=labels==='en'?'ar':'en';this.textContent='Labels: '+labels.toUpperCase();draw()};
$('export').onclick=function(){
  var h1=[['House ID','Date','Time','Town','Language','Feeling 1','Feeling 2','Feeling 3','Place of feeling 1','Place of feeling 2','Place of feeling 3','Sketched elements','Strokes']];
  var h2=[['House ID','Town','Feeling','Place (element)','Strokes','Points','Centre X (0-1000)','Centre Y (0-1000)']];
  function pname(p){return p==='outside'?'Outside / unmarked':p==='hood'?'Neighbourhood':(H.T.en.rooms[p]||p)}
  rows.forEach(function(h){var d=new Date(h.ms),date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),time=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    var ks=(h.marks||[]).map(function(m){return m.k});
    h1.push([h.id,date,time,h.town||'',h.lang||''].concat([0,1,2].map(function(i){return ks[i]?H.T.en.feelings[ks[i]]:''}),[0,1,2].map(function(i){return ks[i]?pname(H.placeOf(h,ks[i])):''}),
      [(h.rooms||[]).map(function(r){return H.T.en.rooms[r.t]||r.t}).join(', '),(h.marks||[]).reduce(function(s,m){return s+m.s.length},0)]));
    (h.marks||[]).forEach(function(m){var n=0,sx=0,sy=0;m.s.forEach(function(st){st.forEach(function(p){n++;sx+=p[0];sy+=p[1]})});
      h2.push([h.id,h.town||'',H.T.en.feelings[m.k],pname(H.placeOf(h,m.k)),m.s.length,n,n?Math.round(sx/n):'',n?Math.round(sy/n):''])})});
  var bytes=H.xlsx([{name:'Houses',rows:h1},{name:'Feelings',rows:h2}]);
  var b=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='houses-feelings.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)};
$('go').onclick=function(){key=$('key').value.trim();$('gmsg').textContent='';load()};
$('key').onkeydown=function(e){if(e.key==='Enter')$('go').onclick()};

chips();
if(H.local()){load()}else{try{key=localStorage.getItem('houses.key')||''}catch(e){}if(key)load();else $('gate').hidden=false}
window.__adm={rows:function(){return rows},xlsx:function(){return null}};
})();
</script>
</body>
</html>
