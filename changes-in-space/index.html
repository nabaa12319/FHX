<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Changes in Space · Open / Closed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#020734;--ink:#FAF1D3;--closed:#A82020;--open:#91AC67}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Heebo,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 470px;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}
header{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px 24px 4px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{font-size:13px;opacity:.75;margin:2px 0 0}
.clock{text-align:right}
.clock .t{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-size:14px;opacity:.8}
#map{width:100%;height:100%;display:block}
#map text,#chart text{font-family:Heebo,system-ui,sans-serif}
aside{padding:8px 24px 8px 8px;display:flex;flex-direction:column;min-height:0}
aside h2{font-size:14px;font-weight:700;margin:4px 0 6px}
.chartbox{flex:1;min-height:0;overflow-y:auto}
#chart{width:100%;display:block}
#map{cursor:grab;touch-action:none}#map.drag{cursor:grabbing}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.days button{font-size:13px;padding:4px 11px}
.bar{grid-column:1/3;padding:8px 24px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid color-mix(in srgb,var(--ink) 45%,transparent);border-radius:999px;padding:6px 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--ink);opacity:.3;margin:0 4px}
.spd{display:flex;align-items:center;gap:10px;font-size:13px}
input[type=range]{width:170px;accent-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-left:auto;align-items:center}
.legend i{display:inline-block;vertical-align:-2px;margin-right:6px}
.sw{width:12px;height:12px;border-radius:50%}
.ln{width:22px;height:4px;border-radius:2px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.35;opacity:0;transition:opacity .12s;max-width:280px;z-index:5}
#tip b{display:block;font-size:14px}
.note{font-size:12px;opacity:.6;margin:6px 0 0}
.src{font-size:12px;opacity:.6;margin:2px 0 0;font-weight:500;letter-spacing:.02em}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 55vh auto auto;overflow:auto;height:auto}body{overflow:auto}header,.bar{grid-column:1}aside{padding:8px 16px;height:420px}}
</style>
</head>

</div>
</div>

        r.setAttribute('x',x0+i*colW);r.setAttribute('y',y);r.setAttribute('width',Math.max(colW-(colW>3?1:0),.6));r.setAttribute('height',rh-1.5);
        if(!s){r.setAttribute('class','fil');r.setAttribute('fill-opacity',.1)}
        else if(s.g==='c')r.setAttribute('fill',RED);
        else if(s.r==='j'){r.setAttribute('fill',RED);r.setAttribute('fill-opacity',.5)}
        else r.setAttribute('fill',GREEN);
        chart.appendChild(r);
        if(s&&s.i&&colW>4){var dt=document.createElementNS(NS,'circle');dt.setAttribute('cx',x0+i*colW+colW/2-.5);dt.setAttribute('cy',y+rh/2-.75);dt.setAttribute('r',1.8);dt.setAttribute('class','fil');chart.appendChild(dt)}
      });
      y+=rh;
    });
  });
  var hl=document.createElementNS(NS,'rect');hl.setAttribute('x',0);hl.setAttribute('width',cw);hl.setAttribute('height',rh);hl.setAttribute('fill','none');hl.setAttribute('class','stk');hl.setAttribute('stroke-width',1.5);hl.setAttribute('opacity',0);hl.id='hl';chart.appendChild(hl);
  var ph=document.createElementNS(NS,'rect');ph.setAttribute('y',head-2);ph.setAttribute('height',y-head+4);ph.setAttribute('width',Math.max(colW,2));ph.setAttribute('fill','none');ph.setAttribute('stroke-width',2);ph.setAttribute('class','stk');ph.id='ph';chart.appendChild(ph);
  CH={x0:x0,colW:colW,rowY:rowY,rh:rh};
}
function colAt(e){var r=chart.getBoundingClientRect();return Math.floor((e.clientX-r.left-CH.x0)/CH.colW)}
chart.addEventListener('mousemove',function(e){
  var r=chart.getBoundingClientRect(),y=e.clientY-r.top,id=null;
  for(var k in CH.rowY)if(y>=CH.rowY[k]&&y<CH.rowY[k]+CH.rh)id=k;
  hoverRow=id;var hl=document.getElementById('hl');
  if(!id){hl.setAttribute('opacity',0);tip.style.opacity=0;return}
  hl.setAttribute('y',CH.rowY[id]);hl.setAttribute('opacity',1);
  var i=colAt(e),c=gates[id].c,ri=IDX[i];
  tip.innerHTML='<b>'+c.name+'</b>'+(ri!=null?REPORTS[ri].d+', '+REPORTS[ri].t+'<br>'+describe(SNAPS[ri][id]):'');tip.style.opacity=1;place(e.clientX,e.clientY);
});
chart.addEventListener('mouseleave',function(){hoverRow=null;tip.style.opacity=0;var hl=document.getElementById('hl');if(hl)hl.setAttribute('opacity',0)});
chart.addEventListener('click',function(e){var i=colAt(e);if(i>=0&&i<IDX.length)t=REPORTS[IDX[i]].m+0.01});

var dayList=[];REPORTS.forEach(function(r){if(dayList.indexOf(r.d)<0)dayList.push(r.d)});
function setDay(d){
  DAY=d;IDX=[];REPORTS.forEach(function(r,i){if(d==='all'||r.d===d)IDX.push(i)});
  T0=REPORTS[IDX[0]].m-20;T1=REPORTS[IDX[IDX.length-1]].m+20;t=T0;
  document.querySelectorAll('#days button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.d===d)});
  drawChart();
}
(function(){var box=document.getElementById('days');['all'].concat(dayList).forEach(function(d){var b=document.createElement('button');b.type='button';b.dataset.d=d;b.textContent=d==='all'?'All days':d;b.onclick=function(){setDay(d)};box.appendChild(b)})})();

/* free zoom and pan */
function setView(v){view=v;target=v.slice();needBuild=true;document.querySelectorAll('.vw').forEach(function(x){x.setAttribute('aria-pressed',false)})}
function zoomAt(lon,lat,f){
  var span=(view[3]-view[1])*f;if(span<0.02||span>2.2)return;
  setView([lon-(lon-view[0])*f,lat-(lat-view[1])*f,lon+(view[2]-lon)*f,lat+(view[3]-lat)*f]);
}
function local(e){var r=svg.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
svg.addEventListener('wheel',function(e){e.preventDefault();var p=INV.apply(null,local(e));zoomAt(p[0],p[1],Math.exp(e.deltaY*0.0018))},{passive:false});
svg.addEventListener('dblclick',function(e){var p=INV.apply(null,local(e));zoomAt(p[0],p[1],0.5)});
var ptrs={},pinch=null;
svg.addEventListener('pointerdown',function(e){ptrs[e.pointerId]=local(e);svg.setPointerCapture(e.pointerId);svg.classList.add('drag');pinch=null});
svg.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId])return;var p=local(e),ids=Object.keys(ptrs);
  if(ids.length===1){var o=ptrs[e.pointerId],dx=(p[0]-o[0])/PX[0],dy=(p[1]-o[1])/PX[1];setView([view[0]-dx,view[1]+dy,view[2]-dx,view[3]+dy])}
  else if(ids.length===2){ptrs[e.pointerId]=p;var a=ptrs[ids[0]],b=ptrs[ids[1]],dist=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinch){var m=INV((a[0]+b[0])/2,(a[1]+b[1])/2);zoomAt(m[0],m[1],pinch/dist)}pinch=dist}
  ptrs[e.pointerId]=p;
});
function up(e){delete ptrs[e.pointerId];pinch=null;if(!Object.keys(ptrs).length)svg.classList.remove('drag')}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=function(){zoomAt((view[0]+view[2])/2,(view[1]+view[3])/2,0.6)};
document.getElementById('zout').onclick=function(){zoomAt((view[0]+view[2])/2,(view[1]+view[3])/2,1/0.6)};

function frame(ts){
  if(last!=null&&playing){t+=(ts-last)/1000*speed;if(t>T1)t=T0}
  if(t<T0)t=T0;
  last=ts;
  var moving=false;
  for(var i=0;i<4;i++){var dv=target[i]-view[i];if(Math.abs(dv)>1e-5){view[i]+=dv*0.12;moving=true}else view[i]=target[i]}
  if(moving||needBuild){fit();build();needBuild=false}
  var hr=(t%1440)/60,bg=sky(hr),k=Math.max(0,Math.min(1,(lum(bg)-0.3)/0.35)),ink=mix(BEIGE,NAVY,k),dark=1-k;
  var bgS=rgb(bg),inkS=rgb(ink),root=document.documentElement.style;
  root.setProperty('--bg',bgS);root.setProperty('--ink',inkS);
  document.querySelectorAll('.stk').forEach(function(e){e.setAttribute('stroke',inkS)});
  document.querySelectorAll('.fil').forEach(function(e){e.setAttribute('fill',inkS)});
  document.querySelectorAll('.wbfill').forEach(function(e){e.setAttribute('fill-opacity',0.05)});
  var ri=reportAt(t),snap=ri>=0?SNAPS[ri]:null,glow=dark>0.25?'url(#glow)':'';
  for(var id in gates){
    var G=gates[id],s=snap?snap[id]:(G.c.region==='Green Line'?SNAPS[0][id]:null);
    if(!s){G.dot.setAttribute('fill','none');G.dot.setAttribute('stroke',inkS);G.dot.setAttribute('stroke-opacity',.5);G.bar.setAttribute('stroke-opacity',0);G.road.setAttribute('stroke-opacity',0);G.roadL.setAttribute('stroke-opacity',0);G.lab.textContent='';G.g.removeAttribute('filter');}
    else{
      G.dot.setAttribute('fill',s.g==='c'?RED:GREEN);G.dot.setAttribute('stroke',bgS);G.dot.setAttribute('stroke-opacity',1);
      G.bar.setAttribute('stroke',inkS);G.bar.setAttribute('stroke-opacity',1);
      var want=s.g==='c'?0:-75;G.cur+=(want-G.cur)*0.15;G.bar.setAttribute('transform','rotate('+(G.base+G.cur).toFixed(1)+')');
      var jam=s.g!=='c'&&s.r==='j',flow=s.g!=='c'&&s.r==='f';
      G.jam+=((jam?1:0)-G.jam)*0.12;
      G.road.setAttribute('stroke',flow?GREEN:inkS);G.road.setAttribute('stroke-opacity',flow?0.7:(jam?0:0.15));G.road.setAttribute('filter',flow?glow:'');
      G.roadL.setAttribute('stroke',RED);G.roadL.setAttribute('stroke-opacity',(0.7*G.jam).toFixed(3));G.roadL.setAttribute('filter',jam?glow:'');
      G.g.setAttribute('filter',glow);
      G.lab.textContent=s.i&&(view[3]-view[1])<0.7?'Inspection':'';G.lab.setAttribute('fill',inkS);
    }
    var on=hover===id||hoverRow===id;G.ring.setAttribute('stroke',inkS);G.ring.setAttribute('opacity',on?1:0);
    if(hover===id){tip.innerHTML='<b>'+G.c.name+'</b>'+describe(s)+(ri>=0?'<br>Last update: '+REPORTS[ri].d+', '+REPORTS[ri].t:'');tip.style.opacity=1}
  }
  var mm=Math.floor(t%1440);
  document.getElementById('clock').textContent=pad(Math.floor(mm/60))+':'+pad(mm%60);
  var dl=ri>=0?REPORTS[ri].d:REPORTS[0].d;if(ri>=0&&Math.floor(t/1440)>Math.floor(REPORTS[ri].m/1440)){var nx=REPORTS[ri+1];if(nx)dl=nx.d}
  document.getElementById('day').textContent=dl+' · '+(ri>=0?'Update '+(ri+1)+' of '+REPORTS.length+' ('+REPORTS[ri].t+')':'Before first update');
  var ph=document.getElementById('ph');if(ph){var pi=IDX.indexOf(ri);ph.setAttribute('x',CH.x0+Math.max(pi,0)*CH.colW);ph.setAttribute('opacity',pi>=0?1:0)}
  requestAnimationFrame(frame);
}

var playBtn=document.getElementById('play'),sp=document.getElementById('speed'),spl=document.getElementById('spdl');
function setSpeed(){speed=0.5*Math.pow(2,sp.value/100*8);spl.textContent='1 sec = '+(speed<1?Math.round(speed*60)+' sec':Math.round(speed)+' min')}
sp.oninput=setSpeed;setSpeed();
playBtn.onclick=function(){playing=!playing;playBtn.textContent=playing?'Pause':'Play'};
document.querySelectorAll('.vw').forEach(function(b){b.onclick=function(){target=VIEWS[b.dataset.v].slice();document.querySelectorAll('.vw').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
document.addEventListener('keydown',function(e){if(e.key===' '&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();playBtn.onclick()}});
window.addEventListener('resize',function(){fit();build();drawChart()});
fit();build();setDay('all');requestAnimationFrame(frame);
</script>
</body>
